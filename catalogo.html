<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <title>Catálogo | Ferretería Los Maestros</title>
    <link rel="icon" href="images/Logo_ferreteria.png" type="image/png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/catalogo.css" />
    <link rel="stylesheet" href="css/carrito.css" />
</head>

<body>
    <header>
        <div>
            <img src="images/Logo_ferreteria.png" alt="Logo ferreteria los maestros" class="logo">
        </div>
        <nav class="menu-navegacion">
            <a href="home.html">Inicio</a>
            <a href="catalogo.html" class="active">Catalogo</a>
            <a href="#">Nosotros</a>
            <a href="contacto.html">Contacto</a>
        </nav>
        <div class="boton-registro">
            <a href="carrito.html" class="enlace-carrito">Carrito <span id="contadorCarrito" class="contador-carrito" aria-label="productos en el carrito">0</span></a>
            <a href="Formulario.html">Registrarse</a>
        </div>
    </header>

    <main class="catalogo">
        <section class="catalogo-encabezado">
            <h1>Catálogo de productos</h1>
            <p>Materiales de construcción, herramientas y ferretería general.</p>
        </section>

        <nav class="categorias" aria-label="Categorías">
            <h2>Categorías</h2>
            <div id="botonesCategorias" class="chips"></div>
            <div id="subcategorias" class="subcategorias" hidden>
                <h3 id="tituloSubcategorias">Tipo de producto</h3>
                <div id="botonesSubcategorias" class="chips chips-sub"></div>
            </div>
        </nav>

        <section class="filtros" aria-label="Filtros del catálogo">
            <div class="filtro">
                <label for="buscador">Buscar</label>
                <input type="search" id="buscador" placeholder="Nombre, marca o código">
            </div>

            <div class="filtro">
                <label for="ordenar">Ordenar por</label>
                <select id="ordenar">
                    <option value="nombre-asc">Nombre (A-Z)</option>
                    <option value="nombre-desc">Nombre (Z-A)</option>
                    <option value="precio-asc">Precio: menor a mayor</option>
                    <option value="precio-desc">Precio: mayor a menor</option>
                </select>
            </div>

            <div class="filtro filtro-check">
                <label class="label-checkbox">
                    <input type="checkbox" id="soloDisponibles">
                    Solo con stock
                </label>
            </div>

            <button type="button" id="limpiarFiltros" class="boton-limpiar">Limpiar filtros</button>
        </section>

        <p id="contador" class="contador" aria-live="polite"></p>

        <section id="listaProductos" class="grilla-productos" aria-label="Productos"></section>

        <p id="sinResultados" class="sin-resultados" hidden>
            No se encontraron productos con los filtros seleccionados.
        </p>
    </main>

    <script src="js/productos.js"></script>
    <script src="js/carrito.js"></script>
    <script src="js/catalogo.js"></script>
</body>

</html>
